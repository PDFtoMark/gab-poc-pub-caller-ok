name: validate article
on:
  push:
    branches: [main]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  validate-articles:
    if: github.event_name == "nonexistent"
    uses: PDFtoMark/gab-poc-pub-callee/.github/workflows/validate-articles.yml@main
    with:
      debug: true
    secrets:
      SCCM_GITHUB_APP_ID: ${{ secrets.SCCM_GITHUB_APP_ID }}
      ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
